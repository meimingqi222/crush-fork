# https://taskfile.dev

version: "3"

vars:
  VERSION:
    sh: git describe --long 2>/dev/null || echo ""
  RACE:
    sh: test -f race.log && echo "1" || echo ""

env:
  CGO_ENABLED: 0
  GOEXPERIMENT: greenteagc

tasks:
  lint:install:
    desc: Install golangci-lint
    cmds:
      - go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest
    env:
      GOTOOLCHAIN: go1.25.0

  lint:
    desc: Run base linters
    cmds:
      - task: lint:log
      - golangci-lint run --path-mode=abs --config=".golangci.yml" --timeout=5m
    env:
      GOEXPERIMENT: null

  lint:log:
    desc: Check that log messages start with capital letters
    cmds:
      - ./scripts/check_log_capitalization.sh

  lint:fix:
    desc: Run base linters and fix issues
    cmds:
      - golangci-lint run --path-mode=abs --config=".golangci.yml" --timeout=5m --fix
    env:
      GOEXPERIMENT: null

  build:
    desc: Run build
    vars:
      LDFLAGS: '{{if .VERSION}}-ldflags="-X github.com/charmbracelet/crush/internal/version.Version={{.VERSION}}"{{end}}'
    cmds:
      - "go build -v {{if .RACE}}-race{{end}} {{.LDFLAGS}} ."
    sources:
      - ./**/*.go
      - go.mod
    generates:
      - crush{{exeExt}}

  run:
    desc: Run build
    cmds:
      - task: build
      - "./crush{{exeExt}} {{.CLI_ARGS}} {{if .RACE}}2>race.log{{end}}"

  run:catwalk:
    desc: Run build with local Catwalk
    env:
      CATWALK_URL: http://localhost:8080
    cmds:
      - task: build
      - ./crush{{exeExt}} {{.CLI_ARGS}}

  run:onboarding:
    desc: Run build with custom config to test onboarding
    env:
      CRUSH_GLOBAL_DATA: tmp/onboarding/data
      CRUSH_GLOBAL_CONFIG: tmp/onboarding/config
    cmds:
      - task: build
      - rm -rf tmp/onboarding
      - ./crush{exeExt} {{.CLI_ARGS}}

  # Test tiers. Pick the cheapest one that can disprove your change; only the
  # last gate before a commit needs `task test`. Note that -race costs about
  # 4x (internal/agent: ~12s -> ~47s) and -count=1 discards Go's test cache,
  # so unchanged packages get re-run for nothing. Neither belongs in an edit
  # loop.

  t:
    desc: 'Fast loop: one package, filtered. Usage: task t -- ./internal/agent -run TestFoo'
    cmds:
      - go test {{.CLI_ARGS}}

  test:pkg:
    desc: 'One or more packages, cached, no race. Usage: task test:pkg -- ./internal/agent/...'
    cmds:
      - go test {{.CLI_ARGS}}

  test:race:
    desc: 'Race check, scoped. Usage: task test:race -- ./internal/agent -run TestRegistry'
    env:
      CGO_ENABLED: 1
    cmds:
      - go test -race {{.CLI_ARGS}}

  test:
    desc: Run all tests under race (slow; pre-commit gate)
    env:
      CGO_ENABLED: 1
    cmds:
      - go test -race -failfast ./... {{.CLI_ARGS}}

  test:gui-release-race:
    desc: Run the reduced GUI/ACP release profile and concurrent package gates under race
    env:
      CGO_ENABLED: 1
    cmds:
      - go test -race ./internal/releasegate ./internal/acp/... ./internal/guiapi/... ./internal/sessionevent/... ./internal/terminal ./internal/blob ./internal/mcplifecycle ./internal/providerauth ./internal/idempotency ./internal/turn -count=1 -timeout=10m
      - go test -race ./internal/agent ./internal/session -count=1 -timeout=10m

  test:gui-release-fault:
    desc: Run deterministic GUI/ACP fault, reconnect, timeout, and recovery gates
    cmds:
      - go test ./internal/releasegate -run '^TestGUIACPReleaseFaultMatrix$' -count=1 -timeout=5m
      - go test ./internal/acp -run 'Test(LineTransportCancellationInterruptsBlocked(Read|Write)|Server(BlockedWriterHasByteAndTimeBounds|DropsDuplicateResponseWithoutBlocking|EnforcesNestingAndMethodDeadline|MissingPermissionResponseHonorsCallerDeadline)|PermissionBridgeForwardsAuthoritySessionID)' -count=1 -timeout=5m
      - go test ./internal/guiapi -run 'Test(SessionSyncReconnectAndExpiredSequence|BlockedNotificationWriterDoesNotBackpressurePublishAndPreservesReliableEvents|SessionSnapshotMapsNotFoundAndSourceFailure|TerminalRejectsOversizedInputBeforePermission|TurnStartIsImmediateIdempotentAndConflictSafe|TurnQueueHandlersCancelRetryAndSteer|TurnCancellationAcknowledgementP95BelowHundredMilliseconds)' -count=1 -timeout=5m
      - go test ./internal/turn -run '^TestStartAcknowledgementP95BelowTwentyMilliseconds$' -count=1 -timeout=5m
      - go test ./internal/mcplifecycle -run 'Test(DynamicReconnectDisableAndShutdown|DynamicReconnectDoesNotCancelSiblingStartup|CapacityAndSessionCloseRevokeBeforeBlockedCleanup)' -count=1 -timeout=5m
      - go test ./internal/providerauth -run 'Test(ManagerCancelOwnershipAndConnectionBarrier|ManagerFailureNeverExposesRawProviderError)' -count=1 -timeout=5m

  test:gui-release-full:
    desc: Run the full 100-session GUI/ACP soak and canonical performance benchmarks without race
    env:
      CRUSH_GUI_SOAK_FULL: "1"
    cmds:
      - go test ./internal/releasegate -run '^TestGUIACP(ReleaseSoak|WarmSnapshotP95)$' -count=1 -timeout=20m -v
      - go test ./internal/acp -run '^$' -bench 'Benchmark(ACPTextDelta|SessionSnapshot|SessionMessagePage|TerminalOutputCoalescing|LongSessionLoad|ConcurrentSessions)$' -benchmem -benchtime=1000x -count=1 -timeout=20m

  test:gui-release:
    desc: Run all deterministic GUI/ACP release gates without real providers or VCR recording
    cmds:
      - task: test:gui-release-race
      - task: test:gui-release-fault
      - task: test:gui-release-full

  test:record:
    desc: Run tests and record all VCR cassettes again
    aliases: [record]
    cmds:
      - rm -r internal/agent/testdata
      - go test -v -count=1 -timeout=1h ./internal/agent

  fmt:
    desc: Run gofumpt
    cmds:
      - gofumpt -w .

  fmt:html:
    desc: Run prettier on HTML/CSS/JS files
    cmds:
      - prettier --write internal/cmd/stats/index.html internal/cmd/stats/index.css internal/cmd/stats/index.js

  modernize:
    desc: Run modernize
    cmds:
      - go run golang.org/x/tools/go/analysis/passes/modernize/cmd/modernize@latest -fix -test ./...

  dev:
    desc: Run with profiling enabled
    env:
      CRUSH_PROFILE: true
    cmds:
      - go run .

  install:
    desc: Install the application
    vars:
      LDFLAGS: '{{if .VERSION}}-ldflags="-X github.com/charmbracelet/crush/internal/version.Version={{.VERSION}}"{{end}}'
    cmds:
      - task: fetch-tags
      - go install {{.LDFLAGS}} -v .
    sources:
      - ./**/*.go
      - go.mod

  profile:cpu:
    desc: 10s CPU profile
    cmds:
      - go tool pprof -http :6061 'http://localhost:6060/debug/pprof/profile?seconds=10'

  profile:heap:
    desc: Heap profile
    cmds:
      - go tool pprof -http :6061 'http://localhost:6060/debug/pprof/heap'

  profile:allocs:
    desc: Allocations profile
    cmds:
      - go tool pprof -http :6061 'http://localhost:6060/debug/pprof/allocs'

  schema:
    desc: Generate JSON schema for configuration
    cmds:
      - go run main.go schema > schema.json
      - echo "Generated schema.json"
    generates:
      - schema.json

  hyper:
    desc: Update Hyper embedded provider.json
    cmds:
      - go generate ./internal/agent/hyper/...
    generates:
      - ./internal/agent/hyper/provider.json

  release:
    desc: Create and push a new tag following semver
    vars:
      NEXT:
        sh: svu next --always || go run github.com/caarlos0/svu/v3@latest next --always
    prompt: "This will release {{.NEXT}}. Continue?"
    preconditions:
      - sh: '[ $(git symbolic-ref --short HEAD) = "main" ]'
        msg: Not on main branch
      - sh: "[ $(git status --porcelain=2 | wc -l) = 0 ]"
        msg: "Git is dirty"
      - sh: 'gh run list --workflow build.yml --commit $(git rev-parse HEAD) --status success --json conclusion -q ".[0].conclusion" | grep -q success'
        msg: "Test build for this commit failed or not present"
      - sh: 'gh run list --workflow snapshot.yml --commit $(git rev-parse HEAD) --status success --json conclusion -q ".[0].conclusion" | grep -q success'
        msg: "Snapshot build for this commit failed or not present"
    cmds:
      - task: fetch-tags
      - git commit --allow-empty -m "{{.NEXT}}"
      - git tag --annotate --sign -m "{{.NEXT}}" {{.NEXT}} {{.CLI_ARGS}}
      - echo "Pushing {{.NEXT}}..."
      - git push origin main --follow-tags

  fetch-tags:
    cmds:
      - git tag -d nightly || true
      - git fetch --tags

  deps:
    desc: Update Fantasy and Catwalk
    cmds:
      - go get charm.land/fantasy
      - go get charm.land/catwalk
      - go mod tidy

  sqlc:
    desc: Generate code using SQLC
    cmds:
      - sqlc generate
